name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 6'   # weekly, 02:00 Sunday Brisbane time: redeploys and rotates the short-lived file access token

permissions:
  contents: read

jobs:
  works-system-tests:
    name: Works system (Python) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: python -m pytest -q tests
        working-directory: azure/functions
      - name: Sample data still has the expected good and bad rows
        run: python data/make_asset_register.py && git diff --exit-code data/asset-register.csv

  mule-package:
    name: Package the Mule application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: The Mule app carries the same contract as /api
        run: diff api/service-request-api.yaml mule/service-request-api/src/main/resources/api/service-request-api.yaml
      - run: mvn -B -ntp -f mule/service-request-api/pom.xml clean package
      - uses: actions/upload-artifact@v4
        with:
          name: service-request-api
          path: mule/service-request-api/target/*.jar
          if-no-files-found: error

  deploy-gate:
    name: Is deployment configured?
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
        run: |
          if [ -n "$ANYPOINT_CLIENT_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "Anypoint connected app secrets are not set, so deployment is skipped."; fi

  deploy:
    name: Deploy to CloudHub 2.0 and test end to end
    needs: [works-system-tests, mule-package, deploy-gate]
    if: needs.deploy-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-dev
    permissions:
      id-token: write
      contents: read
    env:
      RG: rg-service-request-integration-dev
      POM: mule/service-request-api/pom.xml
      # Identifiers, not secrets. The pipeline holds no Azure password or key: Azure
      # trusts a short-lived token issued to the main branch of this repository only.
      AZURE_CLIENT_ID: a10bea01-1038-4736-874b-79cdd71afd61
      AZURE_TENANT_ID: e7a720e0-1a93-4aea-9295-1e01719c5a43
      AZURE_SUBSCRIPTION_ID: 39381496-a5a0-411b-a08b-c01e9c243918
      MULE_BASE_URL: https://service-request-api-dev-tzy4ie.5sc6y6-3.usa-e2.cloudhub.io/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Sign in to Azure (OpenID Connect, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Read settings and secrets from Azure
        run: bash scripts/mule-secrets.sh
      - name: Maven credentials for Anypoint (connected app)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${env.ANYPOINT_CLIENT_ID}~?~${env.ANYPOINT_CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          XML
      - name: Version this release
        run: mvn -B -ntp -f "$POM" versions:set -DnewVersion=1.0.${{ github.run_number }} -DgenerateBackupPoms=false
      - name: Publish the release to Anypoint Exchange
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: mvn -B -ntp -f "$POM" clean deploy
      - name: Deploy that release to CloudHub 2.0
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn -B -ntp -f "$POM" deploy -DmuleDeploy \
            -Dservicebus.namespace="$SB_NAMESPACE" -Dworks.host="$WORKS_HOST" -Dassetfile.host="$ASSET_HOST" \
            -Dservicebus.key="$SB_KEY" -Dworks.key="$WORKS_KEY" -Dassetfile.sas="$ASSET_SAS"
      - name: End-to-end smoke test
        if: env.MULE_BASE_URL != ''
        run: python3 scripts/smoke_test.py --base-url "$MULE_BASE_URL"
